<!doctype html>
<!--
  강의노트 스캐폴드 — 이 파일을 <학기폴더>/slides/NN-핵심어.html 로 복사해 시작한다.
  경로는 slides/ 안에 있다고 가정한 상대경로다. 다른 깊이에 두면 ../../ 를 맞춰야 한다.

  · 슬라이드 유형과 색·치수는 design.md 를 따른다.
  · 과목명·학기·푸터 문구는 여기 쓰지 않는다. ../course.json 에서 자동으로 들어온다.
  · 유형별 실물 카드는 _design/slides/t01-cover.html ~ t11-numbered.html 참조.
    실사용 예로는 2026-1학기_도시경제학입문/slides/06-시장실패정부실패.html 이 가장 정갈하다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N강. 제목</title>

  <link rel="stylesheet" href="../../_shared/vendor/reveal/reset.css">
  <link rel="stylesheet" href="../../_shared/vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../../_shared/theme/tokens.css">
  <link rel="stylesheet" href="../../_shared/theme/cbnu.css">
  <link rel="stylesheet" href="../../_shared/theme/components.css">
  <link rel="stylesheet" href="../../_shared/theme/print.css">

  <!-- 본문의 Fig.draw() 인라인 스크립트보다 먼저 로드되어야 한다 -->
  <script src="../../_shared/js/charts.js"></script>
</head>
<body>
<div class="reveal"><div class="slides">

  <!-- T1 표지 -->
  <section class="s-cover">
    <img class="cover-logo" src="../../_shared/img/cbnu-logo.jpg" alt="충북대학교">
    <p class="cover-label" data-course-label>&nbsp;</p>
    <h1>N강. 제목</h1>
    <!-- 날짜를 적지 않는다. 파일명 앞 두 자리로 course.json 의 lectures 에서 찾아 채운다 -->
    <p class="cover-date" data-course-date>&nbsp;</p>
  </section>

  <!-- T4 개념 + 그래프 2단 -->
  <section class="s-split">
    <h2>슬라이드 제목</h2>
    <div class="body">
      <div class="col-l">
        <p class="caption-blue">표·그림 캡션</p>
        <!-- 표나 설명 -->
      </div>
      <div class="col-r">
        <svg class="fig" id="fig-1" viewBox="0 0 440 300" role="img">
          <title>무엇을 그린 그림인지 적는다</title>
        </svg>
        <script>
          Fig.draw('#fig-1', {
            axes: { x: '가로축 이름', y: '세로축 이름' },
            parts: [
              Fig.curve(Fig.convex()),
            ],
          });
        </script>
      </div>
    </div>
  </section>

</div></div>

<script src="../../_shared/vendor/reveal/reveal.js"></script>
<script src="../../_shared/vendor/reveal/plugin/notes.js"></script>
<script src="../../_shared/vendor/reveal/plugin/math.js"></script>
<script src="../../_shared/js/deck-init.js"></script>
</body>
</html>
