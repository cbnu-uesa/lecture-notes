        · 3장 교역도시와 공장도시 (p.41~53) · 4장 집적의 경제 (p.59~82)

  각 <section> 앞 주석의 [p.N] 이 교재 쪽수다.

<script>
  // ── 이 강의를 관통하는 두 벌의 숫자 ─────────────────────────
  // 표와 그림을 각각 손으로 적으면 반드시 어긋난다. 여기 한 번만 적고
  // 표 HTML 과 도형 좌표를 모두 이 값에서 만든다 (design.md §6.5).

  // 표 3-1 · 그림 3-1 — 스티치와 스퀴즈의 생산성 [p.43]
  window.ISLE = {
    stitch:  { shoes: 12, milk: 2 },   // 시간당 산출량
    squeeze: { shoes: 1,  milk: 1 },
    // 기회비용은 산출량에서 유도한다 — 표에 따로 적지 않는다
    oc(who, good) {
      const p = this[who];
      return good === 'shoes' ? p.milk / p.shoes : p.shoes / p.milk;
    },
  };

  // 그림 3-2 · 3-3 — 공장 구두의 평균비용과 순가격 [p.49~51]
  window.FACTORY = {
    q: 10,            // 공장 노동자의 시간당 구두 산출량
    wFarm: 1.00,      // 낙농 임금 = 노동의 기회비용 (갤런/시간)
    wCity: 0.80,      // 도시 거주·통근에 대한 보상 (갤런/시간)
    rent: 1.2,        // 자본 임대료 (갤런/시간)
    t: 0.10,          // 왕복 1마일당 통행의 기회비용 (갤런)
    cHome: 1.00,      // 가내생산 구두의 비용 (갤런)
    // 유도값은 반올림해서 내보낸다. 1.8/10 은 0.18000000000000002 이라
    // 그대로 두면 시장구역 반경이 6.999999999999999 로 인쇄된다.
    r(v, n = 2)  { return Math.round(v * 10 ** n) / 10 ** n; },
    get wage()   { return this.r(this.wFarm + this.wCity); },   // 1.80
    get acLabor(){ return this.r(this.wage / this.q); },        // 0.18
    get acCap()  { return this.r(this.rent / this.q); },        // 0.12
    get price()  { return this.r(this.acLabor + this.acCap); }, // 0.30
    get radius() { return this.r((this.cHome - this.price) / this.t, 3); }, // 7
    net(x)       { return this.r(this.price + this.t * x); },
  };

  /* ── 아래는 03-집적의경제 에서 옮겨 온 상수 ── */
  // ── 이 강의를 관통하는 숫자 ────────────────────────────────
  // 표와 그림을 따로 적으면 어긋난다. 여기 한 번만 적는다 (design.md §6.5).

  // 그림 4-2 — 노동풀링 [p.63~65]
  window.POOL = {
    wage: 144,        // 고립된 기업의 임금
    switchCost: 44,   // 전직비용
    u(w) { return Math.sqrt(w); },              // 효용함수 u(w) = w^(1/2)
    get lost()  { return this.wage - this.switchCost; },        // 100
    get uHigh() { return this.u(this.wage); },                  // 12
    get uLow()  { return this.u(this.lost); },                  // 10
    get uExp()  { return (this.uHigh + this.uLow) / 2; },       // 11  (해고확률 50%)
    get certEq(){ return Math.round(this.uExp ** 2); },         // 121 = 확실성 등가
  };

  // 그림 4-3 — 숙련매칭 [p.66~68]
  window.MATCH = {
    trainUnit: 30,                                  // 한 단위 기술격차를 없애는 훈련비용
    m(n) { return 1 / (2 * (n - 1)); },             // 평균기술불일치
    cost(n) { return this.trainUnit * this.m(n); }, // 노동자 1명당 훈련비용
    workers(n) { return Array.from({ length: n }, (_, i) => i / (n - 1)); },
    firms(n) { return Array.from({ length: n / 2 }, (_, i) => (2 * i + 1) / (2 * (n - 1)) * 2 / 2 + 0); },
  };

  // 그림 4-4 · 4-5 — 이윤과 군집규모 [p.72~73]
  // 교재 그림의 x축 눈금은 1 · z^E · z* 뿐이고 숫자는 본문에만 나온다.
  // a(1, π₁) 과 c(z*, π₁) 이 정확히 같은 높이여야 하므로 정점을 (1+z*)/2 에 둔다.
  window.CLUSTER = {
    zStar: 30, p1: 5, pE: 12,
    get zE() { return (1 + this.zStar) / 2; },
    get k()  { return (this.pE - this.p1) / (this.zE - 1) ** 2; },
    profit(z) { return this.pE - this.k * (z - this.zE) ** 2; },
  };
</script>

  /* ── 아래는 03-집적의경제 에서 옮겨 온 것 ── */
/* 표 4-1 은 한 장에 12줄까지 들어간다. components.css 의 .reveal table td(0,1,2)를
     이기려면 .reveal 을 붙여 (0,2,1) 로 만들어야 한다. */
  /* components.css 는 .cols 를 align-items:center 로 둔다 — 그림과 글을 나란히 놓을 때의 설정이다.
     이 강의의 2단은 전부 글이라 가운데 정렬이면 짧은 칸이 아래로 밀린다. 위로 맞춘다. */
  .body > .cols { align-items: flex-start; }
  .tbl-cluster { width: 100%; table-layout: fixed; font-size: 13px; }
  .tbl-cluster th:first-child, .tbl-cluster td:first-child { width: 190px; }
  .tbl-cluster td:not(:first-child), .tbl-cluster th:not(:first-child) { text-align: right; }
  .reveal .tbl-cluster td { padding: 2px 10px; line-height: 1.35; }
  .reveal .tbl-cluster th { padding: 3px 10px 5px; }
  .tbl-elast { width: 100%; table-layout: fixed; }
  .tbl-elast th:nth-child(2), .tbl-elast td:nth-child(2) { width: 92px; text-align: right; }
  .tbl-elast td { vertical-align: top; }
  .tbl-num { width: 100%; table-layout: fixed; }
  .tbl-num td:not(:first-child), .tbl-num th:not(:first-child) { text-align: center; }
  .epigraph .who { display: block; margin-top: 4px; color: var(--muted); font-size: var(--fs-caption); }
  .pending { border: 1.4px dashed var(--rule); border-radius: 12px;
    padding: 22px 26px; color: var(--muted); }
</style>
</head>
